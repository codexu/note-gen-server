name: CI and release container image

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: notegen
          POSTGRES_USER: notegen
          POSTGRES_PASSWORD: integration-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notegen -d notegen"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://notegen:integration-password@127.0.0.1:5432/notegen
      PUBLIC_BASE_URL: http://127.0.0.1:3789
      SERVER_NAME: NoteGen CI Server
      AUTH_SECRET: 0123456789abcdef0123456789abcdef
      SETUP_TOKEN: integration-setup-token
      BLOB_STORAGE_PATH: /tmp/notegen-ci-blobs
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Test database upgrade migration
        run: pnpm test:migration-upgrade
      - run: pnpm build
      - run: pnpm db:migrate
      - name: Live protocol test
        env:
          INTEGRATION_BASE_URL: http://127.0.0.1:3789
          INTEGRATION_SETUP_TOKEN: integration-setup-token
        run: |
          node apps/server/dist/entrypoint.js > /tmp/notegen-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3789/health/ready; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/notegen-server.log
              exit 1
            fi
            sleep 1
          done
          pnpm test:integration

  publish:
    needs: verify
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/release')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/note-gen-server
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read and validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $VERSION"
            exit 1
          fi

          for manifest in apps/server/package.json apps/web/package.json packages/contracts/package.json; do
            WORKSPACE_VERSION=$(node -p "require('./$manifest').version")
            if [ "$WORKSPACE_VERSION" != "$VERSION" ]; then
              echo "$manifest version $WORKSPACE_VERSION does not match root version $VERSION"
              exit 1
            fi
          done

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "minor=$(printf '%s' "$VERSION" | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.minor }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=NoteGen Server
            org.opencontainers.image.description=Self-hosted synchronization server and account portal for NoteGen
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
