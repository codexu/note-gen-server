services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: notegen
      POSTGRES_USER: notegen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be configured}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notegen -d notegen"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      MIGRATE_ON_START: ${MIGRATE_ON_START:-true}
      HOST: 0.0.0.0
      PORT: 3789
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be configured}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3789}
      SERVER_NAME: ${SERVER_NAME:-NoteGen Sync Server}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be configured}
      SETUP_TOKEN: ${SETUP_TOKEN:?SETUP_TOKEN must be configured}
      REGISTRATION_MODE: ${REGISTRATION_MODE:-closed}
      BLOB_STORAGE_DRIVER: ${BLOB_STORAGE_DRIVER:-filesystem}
      BLOB_STORAGE_PATH: /var/lib/note-gen-server/blobs
      BACKUP_PATH: /var/lib/note-gen-server/backups
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      MAX_OBJECT_BYTES: ${MAX_OBJECT_BYTES:-2097152}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-16777216}
      MAX_BLOB_BYTES: ${MAX_BLOB_BYTES:-2147483648}
      BLOB_PART_BYTES: ${BLOB_PART_BYTES:-8388608}
      CHANGE_RETENTION_DAYS: ${CHANGE_RETENTION_DAYS:-90}
      VERSION_RETENTION_DAYS: ${VERSION_RETENTION_DAYS:-90}
      TOMBSTONE_RETENTION_DAYS: ${TOMBSTONE_RETENTION_DAYS:-90}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      METRICS_ENABLED: ${METRICS_ENABLED:-false}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      OPENAPI_ENABLED: ${OPENAPI_ENABLED:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      WEB_ENABLED: ${WEB_ENABLED:-true}
      WEB_DIST_PATH: /app/apps/web/out
      WEB_PUBLIC_BASE_URL: ${WEB_PUBLIC_BASE_URL:-}
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-self-hosted}
    ports:
      - "${PORT:-3789}:3789"
    volumes:
      - blob-data:/var/lib/note-gen-server/blobs
      - backup-data:/var/lib/note-gen-server/backups
    read_only: true
    tmpfs:
      - /tmp

volumes:
  postgres-data:
  blob-data:
  backup-data:
